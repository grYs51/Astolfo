name: deploy

on:
  # Deploy only what CI tested and passed on main
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a queued one waits instead of cancelling a running compose up
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # A fork PR can also have a branch called main, so check the event too
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: self-hosted
    environment: .env
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever main points at now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: run astolfo-bot
        run: |
          # A re-run of an old CI run must not deploy over newer code
          if [ -n "$RUN_SHA" ]; then
            # Fail, don't skip quietly, when main can't be read
            head=$(git ls-remote origin refs/heads/main | cut -f1) && [ -n "$head" ] || exit 1
            if [ "$head" != "$RUN_SHA" ]; then
              echo "main has moved past $RUN_SHA, skipping the deploy"
              exit 0
            fi
          fi
          docker compose build --pull && docker compose up -d
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          OWNER: ${{ secrets.OWNER }}
          DEFAULT_PREFIX: ${{ secrets.DEFAULT_PREFIX }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PORT: ${{ secrets.PORT }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          REDIRECT_URI: ${{ secrets.REDIRECT_URI }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          PORT_WEB: ${{ secrets.PORT_WEB }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      - name: clean up docker images
        run: docker image prune -f
