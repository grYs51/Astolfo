name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    name: Lint / Test / Build (affected)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A throwaway database for the tests that need real SQL (xp/grant.db.test.ts, trivia/stats.db.test.ts)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: astolfo
          POSTGRES_PASSWORD: astolfo
          POSTGRES_DB: astolfo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astolfo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      XP_TEST_DATABASE_URL: postgresql://astolfo:astolfo@localhost:5432/astolfo_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          check-latest: true

      - name: Enable corepack (yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Derive SHAs for nx affected
        uses: nrwl/nx-set-shas@v4

      - name: Generate Prisma client
        run: yarn nx run models:prisma-generate

      - name: Apply migrations to the test database
        run: yarn prisma migrate deploy --schema libs/models/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.XP_TEST_DATABASE_URL }}

      - name: Lint, test, build affected projects
        run: yarn nx affected -t lint test build
