<lib-page>
  <lib-navbar [name]="user()?.username" [image]="user()?.avatar| discordImage: 'avatars': user()?.id"
    [loginUrl]="backendUrl + '/auth/login'" [logoutUrl]="backendUrl + '/auth/logout'" [loading]="!sessionChecked()" />

  <div class="mx-auto max-w-7xl px-md lg:px-lg pt-md">
    <lib-breadcrumbs [breadCrumbs]="breadcrumbs$ | async" />
  </div>

  <router-outlet />

</lib-page>
