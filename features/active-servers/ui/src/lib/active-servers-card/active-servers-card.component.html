@let server = guild();

<div class="bg-base-300 p-md rounded-2xl flex items-center gap-md min-w-[200px] w-80 cursor-pointer border-2 border-transparent" [class.isSelected]="isSelected()">
  <img width="48" [src]="server.icon" [alt]="server.name" class="w-16 h-16 rounded-full object-cover" />
  <div>
    <h2 class="text-md font-semibold">{{ server.name }}</h2>
    <p class="text-gray-400">{{ server.totalDuration * 1000 | humanizeDuration: true }}</p>
  </div>
</div>
