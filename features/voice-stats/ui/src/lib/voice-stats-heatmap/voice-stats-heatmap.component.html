<div class="voice-stats-heatmap">
  @if (loading()) {
    <div class="loading-state">
      <div class="animate-pulse space-y-4">
        <div class="h-8 bg-neutral-700 rounded w-1/3"></div>
        <div class="h-96 bg-neutral-700 rounded"></div>
      </div>
    </div>
  } @else {
    <div class="heatmap-header">
      <h3 class="text-lg font-semibold text-neutral-100">Activity Heatmap</h3>
      <p class="text-sm text-neutral-400">Voice activity by time of day and day of week</p>
    </div>

    <!-- Stats Summary -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-md">
      <lib-stat-card
        label="Total Hours"
        [value]="totalHours()"
        icon="⏱️"
        iconColor="text-blue-500"
      />
      <lib-stat-card
        label="Peak Time"
        [value]="peakTimeDisplay()"
        icon="🔥"
        iconColor="text-primary-500"
      />
      <lib-stat-card
        label="Avg per Cell"
        [value]="avgMinutes() + 'm'"
        icon="📊"
        iconColor="text-green-500"
      />
      <lib-stat-card
        label="Max Activity"
        [value]="Math.floor(heatmap().stats.maxValue / 60) + 'h'"
        icon="⚡"
        iconColor="text-purple-500"
      />
    </div>

    <!-- ECharts Heatmap -->
    <div class="bg-base-200 rounded-2xl p-6">
      <div
        echarts
        [options]="chartOption()"
        [initOpts]="{ renderer: 'canvas' }"
        class="heatmap-chart">
      </div>
    </div>

    <!-- Legend Helper -->
    <div class="legend-helper">
      <p class="text-xs text-neutral-500">
        💡 Hover over cells to see detailed statistics. Darker red indicates higher activity.
      </p>
    </div>
  }
</div>
