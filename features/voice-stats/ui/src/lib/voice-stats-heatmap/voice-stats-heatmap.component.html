<div class="voice-stats-heatmap">
  @if (loading()) {
    <div class="loading-state">
      <div class="animate-pulse space-y-4">
        <div class="h-8 w-1/3 rounded bg-base-200"></div>
        <div class="h-96 rounded bg-base-200"></div>
      </div>
    </div>
  } @else {
    <!-- Stats summary -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-md">
      <lib-stat-card
        label="Total Duration"
        [value]="totalHours() + 'h'"
        icon="⏱️"
        subtitle="of voice activity"
      />
      <lib-stat-card
        label="Peak Time"
        [value]="peakTimeDisplay()"
        icon="🔥"
        subtitle="highest activity"
        valueSize="text-xl"
      />
      <lib-stat-card
        label="Avg per Cell"
        [value]="avgMinutes() + 'm'"
        icon="📊"
        subtitle="average duration"
      />
      <lib-stat-card
        label="Max Activity"
        [value]="Math.floor(heatmap().stats.maxValue / 60) + 'h'"
        icon="⚡"
        subtitle="peak cell duration"
      />
    </div>

    <!-- Heatmap chart -->
    <div class="rounded-xl bg-base-300 border border-white/5 p-lg">
      <div class="mb-sm flex items-center justify-between">
        <div>
          <h3 class="text-base font-semibold text-gray-100">Activity by hour and weekday</h3>
          <p class="text-xs text-gray-500">Darker cells mean more voice time (minutes)</p>
        </div>
      </div>
      <div
        echarts
        [options]="chartOption()"
        [initOpts]="{ renderer: 'canvas' }"
        class="heatmap-chart"
      ></div>
    </div>
  }
</div>
