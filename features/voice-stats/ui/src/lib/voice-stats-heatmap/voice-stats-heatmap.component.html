<div class="voice-stats-heatmap">
  @if (loading()) {
    <div class="loading-state">
      <div class="animate-pulse space-y-4">
        <div class="h-8 w-1/3 rounded bg-base-200"></div>
        <div class="h-96 rounded bg-base-200"></div>
      </div>
    </div>
  } @else {
    <!-- Heatmap chart -->
    <div class="rounded-xl bg-base-300 border border-white/5 p-lg">
      <div class="mb-sm flex items-center justify-between">
        <div>
          <h3 class="text-base font-semibold text-gray-100">Busiest times</h3>
          <p class="text-xs text-gray-500">Brighter cells mean more voice time, in your time zone</p>
        </div>
        @if (heatmap().stats.totalMinutes > 0) {
          <span class="rounded-md bg-base-200 px-sm py-xs text-xs text-gray-300">
            Busiest: {{ peakTimeDisplay() }}
          </span>
        }
      </div>
      <div
        echarts
        [options]="chartOption()"
        [initOpts]="{ renderer: 'canvas' }"
        class="heatmap-chart"
      ></div>
    </div>
  }
</div>
