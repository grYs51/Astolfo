<div class="rounded-xl bg-base-300 border border-white/5 p-lg">
  <div class="mb-md flex flex-wrap items-center justify-between gap-sm">
    <h3 class="text-base font-semibold text-gray-100">{{ title() }}</h3>
    <ng-content select="[leaderboard-actions]" />
  </div>

  @if (loading()) {
    <div class="space-y-sm">
      @for (i of [1, 2, 3, 4, 5]; track i) {
        <div class="h-14 rounded-lg bg-base-200 animate-pulse"></div>
      }
    </div>
  } @else if (rows().length === 0) {
    <p class="py-xl text-center text-sm text-gray-400">{{ emptyText() }}</p>
  } @else {
    <ol class="space-y-xs">
      @for (row of top(); track row.member.id) {
        <li>
          <ng-container *ngTemplateOutlet="item; context: { $implicit: row }"></ng-container>
        </li>
      }
    </ol>

    @if (pinned(); as row) {
      <div class="my-xs text-center text-xs text-gray-600" aria-hidden="true">⋯</div>
      <ng-container *ngTemplateOutlet="item; context: { $implicit: row }"></ng-container>
    }
  }
</div>

<ng-template #item let-row>
  <lib-leaderboard-item
    [rank]="row.rank"
    [title]="(row.member.displayName || row.member.username) + (isHighlighted(row) ? ' (you)' : '')"
    [value]="row.value"
    [subtitle]="row.subtitle"
    [avatarUrl]="row.member.avatar || undefined"
    [containerClass]="isHighlighted(row) ? highlightClass : ''"
    [interactive]="interactive()"
    (itemClick)="userClick.emit(row.member.id)"
    icon="🎤"
  />
</ng-template>
