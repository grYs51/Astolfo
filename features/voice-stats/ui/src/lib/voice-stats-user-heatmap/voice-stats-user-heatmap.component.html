<div class="voice-stats-user-heatmap">
  @if (loading()) {
    <div class="loading-state">
      <div class="animate-pulse space-y-4">
        <div class="h-8 bg-neutral-700 rounded w-1/3"></div>
        <div class="h-96 bg-neutral-700 rounded"></div>
      </div>
    </div>
  } @else {
    <div class="heatmap-header mb-md">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="text-2xl font-semibold text-neutral-100 mb-xs">📊 Your Activity vs Server Average</h3>
          <p class="text-sm text-neutral-400">Compare your voice activity patterns to other users</p>
        </div>
        <div class="bg-primary-500/20 text-primary-400 px-md py-xs rounded-lg text-xs font-medium">
          Comparison View
        </div>
      </div>
    </div>

    <!-- Stats Summary -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-md">
      <lib-stat-card
        label="Your Total"
        [value]="totalHours() + 'h'"
        icon="⏱️"
        [subtitle]="heatmap().stats.user.totalMinutes + 'm total'"
        iconColor="text-blue-500"
      />
      <lib-stat-card
        label="Server Average"
        [value]="Math.floor(heatmap().stats.server.avgPerUser / 60) + 'h'"
        icon="📊"
        [subtitle]="'Among ' + heatmap().stats.server.totalUsers + ' users'"
        iconColor="text-purple-500"
      />
      <lib-stat-card
        label="Your Peak Time"
        [value]="peakTimeDisplay()"
        icon="🔥"
        subtitle="Most active time"
        iconColor="text-orange-500"
      />
      <lib-stat-card
        label="Activity Level"
        [value]="heatmap().stats.comparison.userVsServerAvg + '%'"
        icon="📈"
        [subtitle]="comparisonText()"
        [iconColor]="comparisonColor()"
      />
    </div>

    <!-- Comparison Legend -->
    <div class="bg-base-200 rounded-xl p-md mt-lg mb-md">
      <div class="flex items-center justify-center gap-lg text-sm flex-wrap">
        <div class="flex items-center gap-xs">
          <div class="w-4 h-4 rounded" style="background-color: #ef4444"></div>
          <span class="text-gray-300">Much Below Avg</span>
        </div>
        <div class="flex items-center gap-xs">
          <div class="w-4 h-4 rounded" style="background-color: #f97316"></div>
          <span class="text-gray-300">Below Avg</span>
        </div>
        <div class="flex items-center gap-xs">
          <div class="w-4 h-4 rounded" style="background-color: #64748b"></div>
          <span class="text-gray-300">At Average</span>
        </div>
        <div class="flex items-center gap-xs">
          <div class="w-4 h-4 rounded" style="background-color: #3b82f6"></div>
          <span class="text-gray-300">Above Avg</span>
        </div>
        <div class="flex items-center gap-xs">
          <div class="w-4 h-4 rounded" style="background-color: #10b981"></div>
          <span class="text-gray-300">Much Above Avg</span>
        </div>
      </div>
    </div>

    <!-- ECharts Heatmap -->
    <div class="bg-base-200 rounded-2xl p-6 mt-lg">
      <div class="text-xs text-gray-400 mb-sm text-center">
        Colors show how much more (+) or less (-) active you are compared to the server average
      </div>
      <div
        echarts
        [options]="chartOption()"
        [initOpts]="{ renderer: 'canvas' }"
        class="heatmap-chart">
      </div>
    </div>
  }
</div>
