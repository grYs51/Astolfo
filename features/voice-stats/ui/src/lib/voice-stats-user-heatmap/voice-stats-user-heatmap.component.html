<div class="voice-stats-user-heatmap">
  @if (loading()) {
    <div class="loading-state">
      <div class="animate-pulse space-y-4">
        <div class="h-8 w-1/3 rounded bg-base-200"></div>
        <div class="h-96 rounded bg-base-200"></div>
      </div>
    </div>
  } @else {
    <!-- Stats summary -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-sm">
      <lib-stat-card
        label="Your Total"
        [value]="heatmap().stats.user.totalMinutes * 60000 | humanizeDuration: true"
        subtitle="in voice channels"
        [dense]="true"
      />
      <lib-stat-card
        label="Server Average"
        [value]="heatmap().stats.server.avgPerUser * 60000 | humanizeDuration: true"
        [subtitle]="'among ' + heatmap().stats.server.totalUsers + (heatmap().stats.server.totalUsers === 1 ? ' user' : ' users')"
        [dense]="true"
      />
      <lib-stat-card
        label="Your Peak Time"
        [value]="peakTimeDisplay()"
        subtitle="most active hour"
        [dense]="true"
      />
      <lib-stat-card
        label="Activity Level"
        [value]="heatmap().stats.comparison.userVsServerAvg + '%'"
        [subtitle]="comparisonText() + ' vs the server'"
        [dense]="true"
      />
    </div>

    <!-- Comparison heatmap -->
    <div class="rounded-xl bg-base-300 border border-white/5 p-lg">
      <div class="mb-sm flex flex-wrap items-center justify-between gap-sm">
        <div>
          <h3 class="text-base font-semibold text-gray-100">You vs the server average</h3>
          <p class="text-xs text-gray-500">
            Red cells: less active than average · Blue cells: more active
          </p>
        </div>
        <div class="flex flex-wrap items-center gap-md text-xs text-gray-400">
          <span class="flex items-center gap-xs">
            <span class="h-3 w-3 rounded-sm" style="background-color: #dc2626"></span>
            Below avg
          </span>
          <span class="flex items-center gap-xs">
            <span class="h-3 w-3 rounded-sm" style="background-color: #4b5563"></span>
            At avg
          </span>
          <span class="flex items-center gap-xs">
            <span class="h-3 w-3 rounded-sm" style="background-color: #2563eb"></span>
            Above avg
          </span>
        </div>
      </div>
      <div
        echarts
        [options]="chartOption()"
        [initOpts]="{ renderer: 'canvas' }"
        class="heatmap-chart"
      ></div>
    </div>
  }
</div>
